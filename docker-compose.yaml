services:
  postgres:
    image: postgres:16-alpine
    container_name: luniar-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - luniar_postgres_data:/var/lib/postgresql/data
    networks:
      - luniar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: luniar-api
    build:
      context: ./luniar-api
      dockerfile: Dockerfile
    env_file:
      - luniar-api/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - luniar-net
    volumes:
      - ./luniar-api:/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  luniar-net:
    driver: bridge

volumes:
  luniar_postgres_data:
